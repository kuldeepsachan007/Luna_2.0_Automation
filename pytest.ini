[pytest]
testpaths =
    features.steps

# use a relative directory for allure output (no leading slash)
; addopts = --alluredir=allure-results
addopts = --clean-alluredir --alluredir=allure-results

# Enable live logging during test runs so logger.info is visible
log_cli = true
log_cli_level = INFO
log_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Register custom markers to avoid warnings
markers =
    sleep: Sleep module UI tests
    activity: Activity module UI tests
    readiness: Readiness module UI tests
    login: Login module tests
    sign_up_flow: Sign up flow tests
    complete_flow: Complete flow - all modules
    sleep_api: Sleep API tests
    activity_api: Activity API tests
    readiness_api: Readiness API tests
    home_activity: Activity via home page card
    circadian: Circadian Alignment home page tests
    one_tap_vitals: One Tap Vitals home page tests
    api: All API tests (sleep, activity, readiness)

# Suppress SSL and urllib3 warnings
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
    ignore::pytest.PytestUnknownMarkWarning
